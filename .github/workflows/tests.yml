name: Django regression tests
on:
  push:
    branches: [development]
  pull_request:
    branches: [development, master]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.14']
        database: [sqlite, postgresql]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: grocery_app_ci
          POSTGRES_USER: grocery_app_ci
          POSTGRES_PASSWORD: isolated-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U grocery_app_ci -d grocery_app_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SECRET_KEY: ephemeral-ci-key-never-use-for-a-deployment
      DB_ENGINE: ${{ matrix.database }}
      POSTGRES_DB: grocery_app_ci
      POSTGRES_USER: grocery_app_ci
      POSTGRES_PASSWORD: isolated-ci-only
      POSTGRES_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -r requirements.lock
      - run: python -m pip check
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test
      - run: python manage.py migrate --noinput
      - run: python manage.py collectstatic --noinput
